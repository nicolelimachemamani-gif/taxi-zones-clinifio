name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Smoke-test the training pipeline
        run: |
          python -m src.train --synthetic
          python -m src.promote

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Train a model so the image has something to serve
        run: |
          pip install -r requirements.txt
          python -m src.train --synthetic
          python -m src.promote

      - name: Build image
        run: docker build -t demand-zones:${{ github.sha }} .

      - name: Verify the container starts and answers health checks
        run: |
          docker run -d --name app -p 8501:8501 demand-zones:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo "Application is healthy"; exit 0
            fi
            sleep 2
          done
          echo "Application failed to start"; docker logs app; exit 1
